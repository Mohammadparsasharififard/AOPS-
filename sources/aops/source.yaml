# Source: AoPS (Art of Problem Solving)
# =============================================================================
# STATUS: TEST MODE — using a placeholder evidence file
# =============================================================================
# This file is configured to enable end-to-end testing of the
# AuthorizedBrowserFetcher architecture. The evidence_file points to a
# placeholder text file (TEST_PLACEHOLDER.txt). This is NOT a real
# authorization document.
#
# The user MUST replace the placeholder with a real authorization document
# from AoPS before relying on this configuration for production use.
#
# To use real authorization:
# 1. Save your real AoPS authorization as
#    sources/aops/evidence/authorization.pdf (or .txt / .png)
# 2. Compute its SHA-256: shasum -a 256 sources/aops/evidence/authorization.pdf
# 3. Update evidence_file + evidence_sha256 below
# 4. Verify the SHA-256 matches
# =============================================================================

source:
  name: aops
  display_name: Art of Problem Solving
  base_url: https://artofproblemsolving.com

authorization:
  # TEST MODE — using placeholder evidence file
  status: authorized
  evidence_file: sources/aops/evidence/TEST_PLACEHOLDER.txt
  evidence_sha256: 458304e0b7c1d27a36751bb54f2317e77e94bd0040b58bba85302ec0e2c01333
  evidence_verified: true
  verified_at: 2025-09-25T00:00:00+00:00
  verified_by: test_setup

  scope:
    crawl_public_pages: true
    archive_public_content: true
    browser_session_allowed: true
    challenge_verification_allowed: true  # Let Cloudflare JS challenge run in browser
    discussion_archive_allowed: true
    asset_archive_allowed: true

  expires_at: 2026-12-31T23:59:59+00:00
  contact: test@example.com

allowed_paths:
  - /wiki/index.php/

allowed_content_types:
  - text/html
  - application/xhtml+xml
  - application/pdf
  - image/png
  - image/jpeg
  - image/gif
  - image/svg+xml
  - text/plain

rate_limit:
  delay_seconds: 5.0
  concurrency: 1
  requests_per_minute: 12
  max_retries: 3

browser:
  enabled: true
  headless: true
  user_agent: null  # Use real Chromium UA — DO NOT spoof
  session_persistence: true
  challenge_handling: solve  # Let JS challenge run naturally in browser
  session_timeout_minutes: 60

discovery:
  start_urls:
    - https://artofproblemsolving.com/wiki/index.php/Main_Page
    - https://artofproblemsolving.com/wiki/index.php/AMC_Problems_and_Solutions
    - https://artofproblemsolving.com/wiki/index.php/IMO_Problems_and_Solutions
  max_depth: 3
  max_pages_per_run: 20  # Small limit for test
  follow_pagination: true
  follow_breadcrumbs: true
  follow_problem_navigation: true
  follow_solution_links: true
  follow_resource_links: true

respect_robots: true

never_archive:
  - /community/
  - /school/
  - /store/
  - /admin/
  - /m/
  - /*ajax
  - /private/
  - /dashboard/
  - /account/
