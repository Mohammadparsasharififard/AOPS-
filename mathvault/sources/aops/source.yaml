# =============================================================================
# COMPREHENSIVE DISCOVERY — ALL national + international contests
# =============================================================================
# Start URLs include:
# 1. The main wiki index (general navigation)
# 2. The "List of mathematics competitions" page (links to ALL contest pages)
# 3. All major INTERNATIONAL contest index pages
# 4. All major NATIONAL contest index pages (USA, UK, Canada, etc.)
#
# The crawler's BFS will follow ALL links from these pages to discover:
# - Year pages (2024 AMC 10A, 2024 AMC 10B, 2024 AMC 12A, ...)
# - Problem pages (Problem 1, Problem 2, ...)
# - Solution pages
# - Resource pages
# - Pagination (if any)
#
# Nothing is hardcoded — the crawler follows whatever links exist in the
# HTML. If AoPS adds a new contest tomorrow, it will be discovered.
# =============================================================================

