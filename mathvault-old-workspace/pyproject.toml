[project]
name = "mathvault"
version = "1.0.0"
description = "Personal Offline Mathematics Competition Archive — production-ready, allowlist-only crawler + offline-first Web App"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MathVault Maintainer" }]
readme = "README.md"

dependencies = [
    # Web framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    # Database
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    # HTTP / crawling
    "httpx>=0.27.0",
    "tenacity>=8.2.3",
    # Parsing
    "beautifulsoup4>=4.12.3",
    "lxml>=5.1.0",
    "selectolax>=0.3.21",
    # Security
    "bleach>=6.1.0",
    "bcrypt>=4.1.2",
    "python-multipart>=0.0.9",
    # CLI
    "click>=8.1.7",
    "rich>=13.7.0",
    # Config / utils
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    # Rate limiting
    "slowapi>=0.1.9",
    # Search
    # (SQLite FTS5 is built-in; pg_trgm via PostgreSQL extension)
    "jinja2>=3.1.3",        # for templating if needed
    "itsdangerous>=2.1.2",  # for admin session
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
mathvault = "cli.mathvault:cli"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["crawler*", "api*", "database*", "cli*"]
exclude = ["frontend*", "archive*", "data*", "logs*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
